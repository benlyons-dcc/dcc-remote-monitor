<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobs · DCC Environmental Monitor</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    .list-view { display: flex; gap: 10px; }
    .filters { width: 200px; flex-shrink: 0; }
    .filters .field input, .filters .field select { height: 32px; }
    .filters hr { border: 0; border-top: 1px solid #ccc; margin: 12px 0; }
    .filters .btn { margin-bottom: 14px; }
    .table-wrap { flex: 1; min-width: 0; overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-weight: 700; padding: 6px 6px; border-bottom: 2px solid #dee2e6; white-space: nowrap; cursor: pointer; user-select: none; }
    th.nosort { cursor: default; }
    th .sort { display: inline-block; margin-left: 4px; opacity: 0.5; font-size: 10px; }
    th.sorted .sort { opacity: 1; }
    td { padding: 5px 6px; border-bottom: 1px solid #eee; white-space: nowrap; vertical-align: middle; }
    tbody tr { cursor: pointer; }
    tbody tr:hover td { background: #f5f5f5; }
    tr.archived td { color: #aaa; }

    .badge { display: inline-block; min-width: 58px; text-align: center; padding: 1px 8px; border-radius: 3px; color: #fff; font-size: 12px; }
    .badge.active { background: var(--green-dark); }
    .badge.archived { background: #ccc; }
    .kit { font-family: Arial, sans-serif; }
    .dots { display: flex; gap: 4px; align-items: center; }
    .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
    .dot.live { background: #1e9e1e; } .dot.stale { background: #f2c511; } .dot.offline { background: #e32222; } .dot.none { background: #ccc; }
    .running { display: flex; align-items: center; gap: 6px; }
    .link-btn { display: inline-flex; width: 22px; height: 22px; align-items: center; justify-content: center; border: 1px solid #d3d3d3; border-radius: 2px; background: #fff; color: #000; }
    .link-btn:hover { background: #f0f0f0; }
    .count { color: var(--text-dim); font-size: 12px; margin-top: 10px; }

    @media (max-width: 800px) {
      .list-view { flex-direction: column; }
      .filters { width: 100%; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <a class="brand" href="index.html">
    <svg width="26" height="32" viewBox="0 0 26 32"><path d="M13 1C13 1 2 13.5 2 20.5a11 11 0 0 0 22 0C24 13.5 13 1 13 1z" fill="#bccf00"/><path d="M8 21a5 5 0 0 0 5 5" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <div><div class="brand-name">DCC</div><div class="brand-sub">Environmental Monitor</div></div>
  </a>
  <ul class="nav-links">
    <li><a class="selected" href="index.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h2v16h16v2H3V3zm4 10h3v5H7v-5zm5-5h3v10h-3V8zm5 3h3v7h-3v-7z"/></svg><span class="label">Dashboard</span></a></li>
    <li><button onclick="signOut()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span class="label">Logout</span></button></li>
  </ul>
</nav>

<div class="submenu">
  <button id="tabActive" class="selected" onclick="switchView('active')">List view</button>
  <button id="tabArchived" onclick="switchView('archived')">Archive</button>
</div>

<div class="page">
  <div class="panel">
    <div class="list-view">
      <aside class="filters">
        <button class="btn green" onclick="openNewJobModal()">+ New job</button>
        <div class="field"><label for="fId">Job ID</label><input id="fId" oninput="render()"></div>
        <div class="field"><label for="fName">Name</label><input id="fName" oninput="render()"></div>
        <div class="field"><label for="fPostcode">Postcode</label><input id="fPostcode" oninput="render()"></div>
        <div class="field"><label for="fKit">Kit</label><select id="fKit" onchange="render()"><option value="">All kits</option></select></div>
        <hr>
        <div class="field" style="display:flex;gap:8px;align-items:center;cursor:pointer" onclick="toggleOffline()">
          <span class="cb" id="fOffline"></span><span>Offline sensors only</span>
        </div>
      </aside>

      <div class="table-wrap">
        <table>
          <thead><tr id="headRow"></tr></thead>
          <tbody id="jobBody"><tr><td colspan="9" class="empty">Loading…</td></tr></tbody>
        </table>
        <div class="count" id="count"></div>
      </div>
    </div>
  </div>
</div>

<div class="footer">© Disaster Care Capital Ltd <span id="year"></span></div>

<!-- New job modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-head"><span>New job</span><button onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="field"><label for="inputSiteName">Site name</label><input type="text" id="inputSiteName" placeholder="e.g. 42 Example Street, London"></div>
      <div class="field"><label for="inputPostcode">Postcode</label><input type="text" id="inputPostcode" placeholder="e.g. TW8 9HF"></div>
      <div class="field"><label for="inputKit">Device kit</label><select id="inputKit"><option value="">Loading…</option></select></div>
      <div class="field"><label for="inputStartDate">Start date</label><input type="date" id="inputStartDate"></div>
      <div class="field"><label for="inputClickup">ClickUp task ID (optional)</label><input type="text" id="inputClickup" placeholder="e.g. 86a1234bc"></div>
      <div class="form-msg error" id="formError"></div>
    </div>
    <div class="modal-foot">
      <button class="btn light auto" onclick="closeModal()">Cancel</button>
      <button class="btn green auto" id="saveBtn" onclick="createJob()">Create job</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://riidphmmavlmxpdbmsll.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_watyoR-O1_biXRiLc3iW_g_COoGPeCr';
  const sb_auth = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let view = new URLSearchParams(location.search).get('view') === 'archived' ? 'archived' : 'active';
  let jobs = [];
  let sortKey = 'id', sortDir = -1;
  let offlineOnly = false;
  document.getElementById('year').textContent = new Date().getFullYear();

  const COLUMNS = [
    { key: 'id',       label: 'Job ID' },
    { key: 'status',   label: 'Status' },
    { key: 'name',     label: 'Name' },
    { key: 'postcode', label: 'Postcode' },
    { key: 'kit',      label: 'Kit' },
    { key: 'clickup',  label: 'ClickUp', nosort: true },
    { key: 'lastSeen', label: 'Last seen online' },
    { key: 'sensors',  label: 'Sensors', nosort: true },
    { key: 'running',  label: 'Running time' },
  ];

  async function sb(path, opts = {}) {
    const { data: { session } } = await sb_auth.auth.getSession();
    const headers = {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${session?.access_token || SUPABASE_KEY}`,
      'Content-Type': 'application/json',
    };
    if (opts.prefer) headers.Prefer = opts.prefer;
    const resp = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers, method: opts.method || 'GET',
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    if (!resp.ok) throw new Error(`Supabase ${resp.status}: ${await resp.text()}`);
    const text = await resp.text();
    return text ? JSON.parse(text) : null;
  }

  function switchView(v) {
    view = v;
    document.getElementById('tabActive').classList.toggle('selected', v === 'active');
    document.getElementById('tabArchived').classList.toggle('selected', v === 'archived');
    const p = new URLSearchParams(location.search);
    v === 'archived' ? p.set('view', 'archived') : p.delete('view');
    history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p : ''));
    loadJobs();
  }

  async function loadJobs() {
    const body = document.getElementById('jobBody');
    body.innerHTML = '<tr><td colspan="9" class="empty">Loading…</td></tr>';
    try {
      const rows = await sb(`jobs?select=*&active=eq.${view === 'active'}&order=created_at.desc`);
      // Latest readings per job (one small request each, so a busy job can't crowd out the others)
      const latest = await Promise.all((rows || []).map(j =>
        sb(`readings?select=device_name,recorded_at&job_id=eq.${j.id}&order=recorded_at.desc&limit=500`).catch(() => [])
      ));
      const now = Date.now();
      jobs = (rows || []).map((j, i) => {
        const byDevice = {};
        for (const r of latest[i]) if (!byDevice[r.device_name]) byDevice[r.device_name] = r.recorded_at;
        const sensors = Object.entries(byDevice).sort(([a], [b]) => a.localeCompare(b)).map(([name, ts]) => {
          const age = (now - new Date(ts)) / 3600000;
          return { name, ts, status: age < 2 ? 'live' : age < 24 ? 'stale' : 'offline' };
        });
        const lastSeen = sensors.length ? sensors.map(s => s.ts).sort().pop() : null;
        const start = j.job_start_date ? new Date(j.job_start_date) : null;
        const end = j.job_end_date ? new Date(j.job_end_date) : new Date();
        const running = start ? Math.max(0, Math.floor((end - start) / 86400000)) : null;
        return { ...j, sensors, lastSeen, running };
      });

      const kits = [...new Set(jobs.map(j => j.device_kit_name).filter(Boolean))].sort();
      const fKit = document.getElementById('fKit'), cur = fKit.value;
      fKit.innerHTML = '<option value="">All kits</option>' + kits.map(k => `<option>${esc(k)}</option>`).join('');
      fKit.value = kits.includes(cur) ? cur : '';
      render();
    } catch (e) {
      console.error(e);
      body.innerHTML = '<tr><td colspan="9" class="empty">Error loading jobs. Check the console.</td></tr>';
    }
  }

  function sortVal(j, key) {
    switch (key) {
      case 'id': return j.id;
      case 'status': return j.active ? 0 : 1;
      case 'name': return (j.site_name || '').toLowerCase();
      case 'postcode': return j.postcode || '';
      case 'kit': return j.device_kit_name || '';
      case 'lastSeen': return j.lastSeen || '';
      case 'running': return j.running ?? -1;
    }
  }

  function setSort(key) {
    if (sortKey === key) sortDir = -sortDir; else { sortKey = key; sortDir = key === 'name' || key === 'postcode' || key === 'kit' ? 1 : -1; }
    render();
  }

  function toggleOffline() {
    offlineOnly = !offlineOnly;
    document.getElementById('fOffline').classList.toggle('on', offlineOnly);
    render();
  }

  function render() {
    document.getElementById('headRow').innerHTML = COLUMNS.map(c => c.nosort
      ? `<th class="nosort">${c.label}</th>`
      : `<th class="${sortKey === c.key ? 'sorted' : ''}" onclick="setSort('${c.key}')">${c.label}<span class="sort">${sortKey === c.key ? (sortDir > 0 ? '▲' : '▼') : '▲▼'}</span></th>`
    ).join('');

    const fId = document.getElementById('fId').value.trim();
    const fName = document.getElementById('fName').value.trim().toLowerCase();
    const fPc = document.getElementById('fPostcode').value.trim().toLowerCase().replace(/\s/g, '');
    const fKit = document.getElementById('fKit').value;

    const list = jobs.filter(j =>
      (!fId || String(j.id).includes(fId)) &&
      (!fName || (j.site_name || '').toLowerCase().includes(fName)) &&
      (!fPc || (j.postcode || '').toLowerCase().replace(/\s/g, '').includes(fPc)) &&
      (!fKit || j.device_kit_name === fKit) &&
      (!offlineOnly || j.sensors.some(s => s.status !== 'live'))
    ).sort((a, b) => { const x = sortVal(a, sortKey), y = sortVal(b, sortKey); return (x > y ? 1 : x < y ? -1 : 0) * sortDir; });

    const body = document.getElementById('jobBody');
    if (!list.length) {
      body.innerHTML = `<tr><td colspan="9" class="empty">${jobs.length ? 'No jobs match the filters' : view === 'active' ? 'No active jobs' : 'No archived jobs'}</td></tr>`;
      document.getElementById('count').textContent = '';
      return;
    }

    body.innerHTML = list.map(j => {
      const worst = j.sensors.some(s => s.status === 'offline') ? 'offline' : j.sensors.some(s => s.status === 'stale') ? 'stale' : j.sensors.length ? 'live' : 'none';
      const dots = j.sensors.map(s => `<span class="dot ${s.status}" title="${esc(s.name)} · ${fmtTs(s.ts)}"></span>`).join('')
        || '<span style="color:#aaa">No readings yet</span>';
      const clickup = j.clickup_task_id
        ? `<a class="link-btn" href="https://app.clickup.com/t/${encodeURIComponent(j.clickup_task_id)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Open ClickUp task">
             <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M14 3h7v7M10 14 21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg></a>`
        : '';
      return `<tr class="${j.active ? '' : 'archived'}" onclick="location.href='jobs.html?job=${j.id}'">
        <td>${j.id}</td>
        <td><span class="badge ${j.active ? 'active' : 'archived'}">${j.active ? 'Active' : 'Archived'}</span></td>
        <td>${esc(j.site_name || 'Unnamed')}</td>
        <td>${esc(j.postcode || '—')}</td>
        <td class="kit">${esc(j.device_kit_name || '—')}</td>
        <td>${clickup}</td>
        <td>${j.lastSeen ? fmtTs(j.lastSeen) : '—'}</td>
        <td><div class="dots">${dots}</div></td>
        <td>${j.running == null ? '—' : `<span class="running"><span class="dot ${j.active ? worst : 'none'}"></span>${j.running} day${j.running === 1 ? '' : 's'}</span>`}</td>
      </tr>`;
    }).join('');
    document.getElementById('count').textContent = `${list.length} of ${jobs.length} job${jobs.length === 1 ? '' : 's'}`;
  }

  // ── New job ────────────────────────────────────────────
  async function openNewJobModal() {
    document.getElementById('formError').textContent = '';
    document.getElementById('inputSiteName').value = '';
    document.getElementById('inputPostcode').value = '';
    document.getElementById('inputClickup').value = '';
    document.getElementById('inputStartDate').value = new Date().toISOString().split('T')[0];
    const sel = document.getElementById('inputKit');
    try {
      const config = await sb('config?select=device_kit_name');
      const kits = [...new Set(config.map(r => r.device_kit_name))].sort();
      sel.innerHTML = kits.map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join('');
    } catch (e) {
      sel.innerHTML = '<option value="">Error loading kits</option>';
    }
    document.getElementById('modalOverlay').classList.add('open');
    setTimeout(() => document.getElementById('inputSiteName').focus(), 50);
  }

  function closeModal(e) {
    if (e && e.target !== document.getElementById('modalOverlay')) return;
    document.getElementById('modalOverlay').classList.remove('open');
  }

  async function createJob() {
    const siteName = document.getElementById('inputSiteName').value.trim();
    const postcode = document.getElementById('inputPostcode').value.trim();
    const kit = document.getElementById('inputKit').value;
    const startDate = document.getElementById('inputStartDate').value;
    const err = document.getElementById('formError');
    const btn = document.getElementById('saveBtn');
    err.textContent = '';
    if (!siteName) { err.textContent = 'Site name is required.'; return; }
    if (!postcode) { err.textContent = 'Postcode is required.'; return; }
    if (!kit) { err.textContent = 'Device kit is required.'; return; }

    btn.disabled = true; btn.textContent = 'Creating…';
    try {
      const result = await sb('jobs', {
        method: 'POST', prefer: 'return=representation',
        body: {
          site_name: siteName, postcode: postcode.toUpperCase(), device_kit_name: kit,
          job_start_date: startDate || null, active: true,
          clickup_task_id: document.getElementById('inputClickup').value.trim() || null,
        },
      });
      document.getElementById('modalOverlay').classList.remove('open');
      if (result && result[0]) location.href = `jobs.html?job=${result[0].id}`;
      else loadJobs();
    } catch (e) {
      err.textContent = 'Error creating job: ' + e.message;
    }
    btn.disabled = false; btn.textContent = 'Create job';
  }

  // ── Helpers ────────────────────────────────────────────
  const pad = n => String(n).padStart(2, '0');
  function fmtTs(ts) {
    const d = new Date(ts);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ── Auth + init ────────────────────────────────────────
  async function signOut() { await sb_auth.auth.signOut(); location.href = 'login.html'; }

  (async () => {
    const { data: { session } } = await sb_auth.auth.getSession();
    if (!session) { location.href = 'login.html'; return; }
    switchView(view);
  })();
</script>
</body>
</html>
