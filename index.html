<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DCC Monitor — Jobs</title>
  <style>
    :root {
      --navy:       #0f1e2e;
      --navy-mid:   #162436;
      --navy-light: #1e3348;
      --steel:      #2c4a63;
      --rule:       #243a50;
      --teal:       #00b4a0;
      --teal-dim:   rgba(0,180,160,0.12);
      --amber:      #f59e0b;
      --red:        #ef4444;
      --text:       #e2eaf2;
      --text-mid:   #8ba3b8;
      --text-dim:   #4d6880;
      --card:       #162436;
      --card-border:#1e3348;
      --radius:     8px;
      --font-mono:  'JetBrains Mono', 'Fira Mono', monospace;
      --font-body:  'Inter', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--navy); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.5; min-height: 100vh; }
    header { background: var(--navy-mid); border-bottom: 1px solid var(--rule); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-mark { width: 28px; height: 28px; background: var(--teal); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--navy); letter-spacing: -0.5px; font-family: var(--font-mono); }
    .logo-text { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    .logo-sub  { font-size: 11px; color: var(--text-mid); }
    .new-job-btn { background: var(--teal); border: none; color: var(--navy); padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .new-job-btn:hover { opacity: 0.9; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .tabs { display: flex; border-bottom: 1px solid var(--rule); margin-bottom: 20px; }
    .tab { padding: 10px 20px; font-size: 13px; font-weight: 500; color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.15s; }
    .tab:hover { color: var(--text-mid); }
    .tab.active { color: var(--teal); border-bottom-color: var(--teal); }
    .job-table { width: 100%; border-collapse: collapse; }
    .job-table th { text-align: left; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); padding: 8px 12px; border-bottom: 1px solid var(--rule); }
    .job-table td { padding: 12px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
    .job-table tr:last-child td { border-bottom: none; }
    .job-table tbody tr { cursor: pointer; transition: background 0.1s; }
    .job-table tbody tr:hover { background: var(--navy-mid); }
    .job-name { font-weight: 600; }
    .group-badge { font-family: var(--font-mono); font-size: 12px; background: var(--navy-light); border: 1px solid var(--rule); padding: 2px 8px; border-radius: 4px; color: var(--text-mid); }
    .date-cell { font-size: 12px; color: var(--text-mid); font-family: var(--font-mono); }
    .device-indicators { display: flex; gap: 4px; flex-wrap: wrap; }
    .device-pill { display: flex; align-items: center; gap: 4px; font-size: 11px; font-family: var(--font-mono); color: var(--text-mid); background: var(--navy-light); border: 1px solid var(--rule); padding: 2px 7px; border-radius: 12px; }
    .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); }
    .pill-dot.live { background: var(--teal); }
    .pill-dot.stale { background: var(--amber); }
    .pill-dot.offline { background: var(--red); }
    .chevron { color: var(--text-dim); }
    .empty-state { text-align: center; padding: 48px 24px; color: var(--text-dim); font-size: 13px; }
    .empty-state p { margin-bottom: 16px; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--navy-mid); border: 1px solid var(--rule); border-radius: 12px; padding: 24px; width: 380px; max-width: calc(100vw - 32px); }
    .modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-mid); margin-bottom: 6px; }
    .form-group input, .form-group select { width: 100%; background: var(--navy-light); border: 1px solid var(--rule); color: var(--text); padding: 8px 10px; border-radius: var(--radius); font-size: 13px; font-family: var(--font-body); }
    .form-group input:focus, .form-group select:focus { border-color: var(--teal); outline: none; }
    .modal-actions { display: flex; gap: 8px; margin-top: 20px; }
    .btn-primary { flex: 1; background: var(--teal); border: none; color: var(--navy); padding: 9px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: none; border: 1px solid var(--rule); color: var(--text-mid); padding: 9px 16px; border-radius: var(--radius); font-size: 13px; cursor: pointer; }
    .btn-secondary:hover { border-color: var(--text-mid); }
    .form-error { font-size: 11px; color: var(--red); margin-top: 12px; min-height: 16px; }
    @media (max-width: 700px) {
      main { padding: 16px; } header { padding: 0 16px; }
      .job-table th:nth-child(3), .job-table td:nth-child(3),
      .job-table th:nth-child(4), .job-table td:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">DC</div>
    <div>
      <div class="logo-text">Disaster Care Capital</div>
      <div class="logo-sub">Environmental Monitor</div>
    </div>
  </div>
  <button class="new-job-btn" onclick="openNewJobModal()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    New job
  </button>
</header>

<main>
  <div class="tabs">
    <div class="tab active" id="tabActive" onclick="switchTab('active')">Active</div>
    <div class="tab" id="tabArchived" onclick="switchTab('archived')">Archived</div>
  </div>
  <div id="jobList"><div class="empty-state"><p>Loading...</p></div></div>
</main>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <h3>New job</h3>
    <div class="form-group">
      <label>Site name</label>
      <input type="text" id="inputSiteName" placeholder="e.g. 42 Example Street, London">
    </div>
    <div class="form-group">
      <label>Postcode</label>
      <input type="text" id="inputPostcode" placeholder="e.g. TW8 9HF">
    </div>
    <div class="form-group">
      <label>Device group</label>
      <select id="inputGroup"><option value="">Loading...</option></select>
    </div>
    <div class="form-group">
      <label>Start date</label>
      <input type="date" id="inputStartDate">
    </div>
    <div class="form-error" id="formError"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" id="saveBtn" onclick="createJob()">Create job</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://riidphmmavlmxpdbmsll.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_watyoR-O1_biXRiLc3iW_g_COoGPeCr';

  let currentTab = 'active';

  async function sb(path, opts = {}) {
    const headers = {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
    };
    if (opts.prefer) headers['Prefer'] = opts.prefer;
    const resp = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers, method: opts.method || 'GET',
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    if (!resp.ok) { const txt = await resp.text(); throw new Error(`Supabase ${resp.status}: ${txt}`); }
    const text = await resp.text();
    return text ? JSON.parse(text) : null;
  }

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tabActive').classList.toggle('active', tab === 'active');
    document.getElementById('tabArchived').classList.toggle('active', tab === 'archived');
    loadJobs();
  }

  async function loadJobs() {
    const list = document.getElementById('jobList');
    list.innerHTML = '<div class="empty-state"><p>Loading...</p></div>';
    try {
      const isActive = currentTab === 'active';
      const jobs = await sb(`jobs?select=*&active=eq.${isActive}&order=created_at.desc`);

      if (!jobs || jobs.length === 0) {
        list.innerHTML = `<div class="empty-state"><p>${isActive ? 'No active jobs.' : 'No archived jobs.'}</p>${isActive ? '<button class="new-job-btn" onclick="openNewJobModal()" style="margin:0 auto">New job</button>' : ''}</div>`;
        return;
      }

      // Load latest readings for status indicators
      const jobIds = jobs.map(j => j.id);
      const readings = await sb(`readings?select=device_name,job_id,recorded_at&job_id=in.(${jobIds.join(',')})&order=recorded_at.desc`);

      const latestByJobDevice = {};
      for (const r of readings) {
        const key = `${r.job_id}:${r.device_name}`;
        if (!latestByJobDevice[key]) latestByJobDevice[key] = r;
      }

      const now = new Date();

      list.innerHTML = `
        <table class="job-table">
          <thead>
            <tr>
              <th>Site</th><th>Group</th><th>Postcode</th>
              <th>${isActive ? 'Started' : 'Period'}</th>
              <th>Devices</th><th></th>
            </tr>
          </thead>
          <tbody>
            ${jobs.map(job => {
              const jobDevices = [...new Set(readings.filter(r => r.job_id === job.id).map(r => r.device_name))].sort();
              const pills = jobDevices.map(name => {
                const latest = latestByJobDevice[`${job.id}:${name}`];
                const age = latest ? (now - new Date(latest.recorded_at)) / 3600000 : Infinity;
                const status = age < 2 ? 'live' : age < 24 ? 'stale' : 'offline';
                return `<div class="device-pill"><div class="pill-dot ${status}"></div>${name}</div>`;
              }).join('');
              const startDate = job.job_start_date ? formatDate(job.job_start_date) : '—';
              const endDate   = job.job_end_date   ? formatDate(job.job_end_date)   : null;
              const dateCell  = isActive ? startDate : `${startDate}${endDate ? ' → ' + endDate : ''}`;
              return `
                <tr onclick="window.location.href='jobs.html?job=${job.id}'">
                  <td><div class="job-name">${escHtml(job.site_name || 'Unnamed')}</div></td>
                  <td><span class="group-badge">${escHtml(job.device_group_name)}</span></td>
                  <td><span class="date-cell">${escHtml(job.postcode || '—')}</span></td>
                  <td><span class="date-cell">${dateCell}</span></td>
                  <td><div class="device-indicators">${pills || '<span style="color:var(--text-dim);font-size:11px">No readings yet</span>'}</div></td>
                  <td><svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>`;
    } catch(e) {
      console.error(e);
      list.innerHTML = '<div class="empty-state"><p>Error loading jobs — check console</p></div>';
    }
  }

  async function openNewJobModal() {
    document.getElementById('formError').textContent = '';
    document.getElementById('inputSiteName').value = '';
    document.getElementById('inputPostcode').value = '';
    document.getElementById('inputStartDate').value = new Date().toISOString().split('T')[0];
    try {
      const config = await sb('config?select=device_group_name');
      const groups = [...new Set(config.map(r => r.device_group_name))].sort();
      document.getElementById('inputGroup').innerHTML = groups.map(g => `<option value="${g}">${g}</option>`).join('');
    } catch(e) {
      document.getElementById('inputGroup').innerHTML = '<option value="">Error loading groups</option>';
    }
    document.getElementById('modalOverlay').classList.add('open');
    setTimeout(() => document.getElementById('inputSiteName').focus(), 50);
  }

  function closeModal(e) {
    if (e && e.target !== document.getElementById('modalOverlay')) return;
    document.getElementById('modalOverlay').classList.remove('open');
  }

  async function createJob() {
    const siteName  = document.getElementById('inputSiteName').value.trim();
    const postcode  = document.getElementById('inputPostcode').value.trim();
    const group     = document.getElementById('inputGroup').value;
    const startDate = document.getElementById('inputStartDate').value;
    const errEl     = document.getElementById('formError');
    const saveBtn   = document.getElementById('saveBtn');

    errEl.textContent = '';
    if (!siteName) { errEl.textContent = 'Site name is required.'; return; }
    if (!postcode)  { errEl.textContent = 'Postcode is required.'; return; }
    if (!group)     { errEl.textContent = 'Device group is required.'; return; }

    saveBtn.disabled = true;
    saveBtn.textContent = 'Creating...';

    try {
      const result = await sb('jobs', {
        method: 'POST', prefer: 'return=representation',
        body: { site_name: siteName, postcode: postcode.toUpperCase(), device_group_name: group, job_start_date: startDate || null, active: true }
      });
      document.getElementById('modalOverlay').classList.remove('open');
      if (result && result[0]) window.location.href = `jobs.html?job=${result[0].id}`;
      else loadJobs();
    } catch(e) {
      errEl.textContent = 'Error creating job — ' + e.message;
    }

    saveBtn.disabled = false;
    saveBtn.textContent = 'Create job';
  }

  function formatDate(d) {
    return new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.getElementById('modalOverlay').classList.remove('open');
  });

  loadJobs();
</script>
</body>
</html>
