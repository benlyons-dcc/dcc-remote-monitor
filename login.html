<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · DCC Environmental Monitor</title>
  <link rel="stylesheet" href="theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    .page { padding-top: 70px; background: #fff; }
    .login { max-width: 420px; padding: 14px 28px 40px; }
    .login h1 { font-size: 32px; font-weight: 400; margin-bottom: 6px; }
    .login p { margin-bottom: 8px; }
    .login .field input { height: 34px; max-width: 280px; }
    .login .btn { max-width: 280px; height: 32px; margin-top: 8px; }
    .company { margin-top: 26px; }
    .company h2 { font-size: 24px; font-weight: 400; margin-bottom: 4px; }
    .msg { max-width: 280px; margin-top: 10px; font-size: 13px; min-height: 18px; }
    .msg.error { color: var(--red); }
    .msg.success { color: var(--green-dark); }
  </style>
</head>
<body>

<nav class="nav">
  <a class="brand" href="index.html">
    <svg width="26" height="32" viewBox="0 0 26 32"><path d="M13 1C13 1 2 13.5 2 20.5a11 11 0 0 0 22 0C24 13.5 13 1 13 1z" fill="#bccf00"/><path d="M8 21a5 5 0 0 0 5 5" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <div><div class="brand-name">DCC</div><div class="brand-sub">Environmental Monitor</div></div>
  </a>
</nav>

<div class="page">
  <div class="login">
    <h1>Login</h1>
    <p>Enter your email and we'll send you a sign-in link. No password needed.</p>
    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="you@disastercare.co.uk" autofocus>
    </div>
    <button class="btn green" id="btn" onclick="send()">Send sign-in link</button>
    <div class="msg" id="msg"></div>

    <div class="company">
      <h2>Disaster Care Capital Ltd</h2>
      <div>Fire and flood restoration</div>
      <div>Brentford, London</div>
    </div>
  </div>
</div>

<div class="footer">© Disaster Care Capital Ltd <span id="year"></span></div>

<script>
  const SUPABASE_URL = 'https://riidphmmavlmxpdbmsll.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_watyoR-O1_biXRiLc3iW_g_COoGPeCr';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Already logged in — go straight to app
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'index.html';
  });

  // Handle redirect back from magic link
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session) window.location.href = 'index.html';
  });

  document.getElementById('email').addEventListener('keydown', e => {
    if (e.key === 'Enter') send();
  });

  async function send() {
    const email = document.getElementById('email').value.trim();
    const btn   = document.getElementById('btn');
    const msg   = document.getElementById('msg');
    msg.className = 'msg';

    if (!email) {
      msg.className = 'msg error';
      msg.textContent = 'Please enter your email address.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Sending...';

    const redirectTo = window.location.origin +
      window.location.pathname.replace('login.html', 'index.html');

    const { error } = await sb.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: redirectTo }
    });

    if (error) {
      msg.className = 'msg error';
      msg.textContent = 'Error: ' + error.message;
      btn.disabled = false;
      btn.textContent = 'Send sign-in link';
    } else {
      msg.className = 'msg success';
      msg.textContent = 'Check your email. A sign-in link is on its way.';
      btn.textContent = 'Link sent';
    }
  }
</script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
