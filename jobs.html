<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job · DCC Environmental Monitor</title>
  <link rel="stylesheet" href="theme.css">
  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* Title row */
    .title-row { display: flex; align-items: flex-start; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
    .title-row h1 { font-size: 20px; font-weight: 400; line-height: 28px; }
    .title-row .sub { color: var(--text); }
    .title-right { margin-left: auto; display: flex; align-items: center; gap: 8px; position: relative; }
    .updated { color: var(--text-dim); font-size: 12px; }
    .gear-menu { display: none; position: absolute; right: 0; top: 34px; z-index: 50; background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; box-shadow: 0 4px 14px var(--shadow); min-width: 170px; }
    .gear-menu.open { display: block; }
    .gear-menu button { display: block; width: 100%; text-align: left; padding: 8px 12px; background: none; border: 0; color: var(--text); }
    .gear-menu button:hover { background: var(--hover); }
    .spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Chart + sidebar */
    .chart-view { display: flex; gap: 14px; }
    .chart-box { flex: 1; min-width: 0; height: 490px; position: relative; }
    .chart-box .no-series { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-dim); }
    .sidebar { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
    .sidebar hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
    .sidebar .field { margin-bottom: 0; }
    .collapse { display: none; background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 4px; padding: 8px; }
    .collapse.open { display: block; }
    .axis-grid { display: grid; grid-template-columns: auto 1fr 1fr; gap: 6px 8px; align-items: center; }
    .axis-grid input { height: 30px; padding: 3px 8px; border: 1px solid var(--input-bd); border-radius: 3.5px; width: 100%; font: inherit; background: var(--surface); color: var(--text); }
    .type-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .type-item { display: flex; align-items: center; gap: 6px; font-weight: 700; cursor: pointer; }
    .side-msg { font-size: 12px; color: var(--red); min-height: 16px; }

    /* Node cards */
    .nodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; margin-top: 14px; }
    .node { border: 1px solid var(--green); border-radius: 4px; overflow: hidden; background: var(--panel); }
    .node .status-bar { background: var(--green); padding: 4px; display: flex; align-items: center; }
    .node .status-text { color: #ffffff; font-weight: 700; padding: 0 8px; }
    .wet-flag { margin-left: auto; padding: 1px 10px; border-radius: 3px; font-weight: 700; font-size: 12px; letter-spacing: 0.04em; background: #ffffff; cursor: help; }
    .wet-flag.dry { color: #1e8a1e; }
    .wet-flag.wet { color: #1f5fa8; }
    .wet-flag.old { opacity: 0.6; }
    .node .signal { width: 24px; height: 24px; border: 1px solid #ffffff; border-radius: 2px; display: inline-flex; align-items: flex-end; justify-content: center; gap: 2px; padding: 3px; }
    .node .signal i { width: 4px; background: #ffffff; opacity: 0.35; }
    .node .signal i.on { opacity: 1; }
    .node.delayed { border-color: var(--amber); } .node.delayed .status-bar { background: var(--amber); }
    .node.offline { border-color: var(--red); }   .node.offline .status-bar { background: var(--red); }
    .node.external { border-color: var(--grey); } .node.external .status-bar { background: var(--grey); }
    .node.waiting  { border-color: var(--grey); border-style: dashed; } .node.waiting .status-bar { background: var(--grey); }
    .node .contents { padding: 4px; }
    .node .info-row { display: flex; min-height: 24px; align-items: center; }
    .node .info-label { width: 120px; padding-left: 8px; font-weight: 700; flex-shrink: 0; }
    .node .info-val { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .node .info-val .pen { background: none; border: 0; padding: 0 2px; color: var(--text); display: inline-flex; }
    .node .info-head { margin-bottom: 6px; }

    .sensor-row { background: var(--row); border-radius: 4px; margin-top: 4px; }
    .sensor-row.sel { background: var(--row-sel); }
    .sensor-row .row { display: flex; align-items: center; padding: 4px; gap: 8px; }
    .sensor-row .code { width: 48px; font-weight: 400; text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; padding-left: 2px; }
    .sensor-row .val-wrap { display: flex; border-radius: 4px; overflow: hidden; }
    .sensor-row .val { width: 88px; height: 24px; background: var(--val-bg); font-size: 11.2px; display: flex; align-items: center; justify-content: center; color: var(--val-text); }
    .sensor-row .swatch { width: 24px; height: 24px; background: var(--swatch-off); }
    .sensor-row .menu { margin-left: auto; width: 24px; height: 24px; border-radius: 4px; border: 0; background: var(--btn); color: #ffffff; display: inline-flex; align-items: center; justify-content: center; }
    .sensor-row .stats { display: none; padding: 0 8px 6px 34px; font-size: 12px; color: var(--text-mid); gap: 14px; }
    .sensor-row.show-stats .stats { display: flex; }

    @media (max-width: 900px) {
      .chart-view { flex-direction: column; }
      .sidebar { width: 100%; }
      .chart-box { flex: none; height: 440px; }
      .nodes { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <div class="panel">
    <div class="tabs"><span class="tab">Chart view</span></div>
    <div class="tab-body">

      <div class="title-row">
        <a class="round-btn" href="index.html" title="All jobs">

              <span id="rightAxisLabel">Right</span><input id="y1Min" type="number" step="any" oninput="updateChart()"><input id="y1Max" type="number" step="any" oninput="updateChart()">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://riidphmmavlmxpdbmsll.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_watyoR-O1_biXRiLc3iW_g_COoGPeCr';
  const sb_auth = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Series colours, one per sensor (Simplify-style greens, blues, yellows)
  const PALETTE = ['#5F6EAE', '#4BA91F', '#D4C400', '#FFA500', '#2E9CCA', '#48B704', '#C0392B', '#8E44AD', '#16A085', '#E67E22'];
  const WEATHER = 'weather';

  // Reading types, in Simplify's order and with Simplify's codes
  const TYPES = {
    DWT: { name: 'Dew point',                  unit: '°C',   dp: 1, field: 'dwt' },
    HUM: { name: 'Relative humidity',          unit: '%rH',  dp: 1, field: 'humidity',      wfield: 'weather_humidity' },
    PDV: { name: 'Saturation vapour pressure', unit: 'mBar', dp: 2, field: 'pdv' },
    TMP: { name: 'Temperature',                unit: '°C',   dp: 1, field: 'temperature',   wfield: 'weather_temp' },
    WCT: { name: 'Water content',              unit: 'g/m³', dp: 2, field: 'water_content' },
    GPK: { name: 'Moisture ratio',             unit: 'g/kg', dp: 2, field: 'gpk' },
  };
  const CODES = Object.keys(TYPES);

  // Wet / dry flag on each sensor card: dry when BOTH are at or below these
  const DRY_GPK = 10;   // g/kg
  const DRY_RH  = 60;   // %rH (stops a cold, damp room showing dry)

  let job = null;
  let allReadings = [];
  let weatherRows = [];
  let deviceSettings = {};
  let devices = [];
  let sources = [];           // devices + weather
  let selection = [];         // ordered list of "source|CODE"
  let statsOpen = new Set();
  let chart = null;
  let editingDevice = null;

  const jobId = new URLSearchParams(location.search).get('job');
  if (!jobId) location.href = 'index.html';
  document.getElementById('year').textContent = new Date().getFullYear();

  // ── Supabase ───────────────────────────────────────────
  async function sb(path, opts = {}) {
    const { data: { session } } = await sb_auth.auth.getSession();
    const headers = {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${session?.access_token || SUPABASE_KEY}`,
      'Content-Type': 'application/json',
    };
    if (opts.prefer) headers.Prefer = opts.prefer;
    const resp = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers, method: opts.method || 'GET',
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    if (!resp.ok) throw new Error(`Supabase ${resp.status}: ${await resp.text()}`);
    const text = await resp.text();
    return text ? JSON.parse(text) : null;
  }

  // PostgREST caps each response (1000 rows by default), so page through everything
  async function sbAll(path) {
    const out = [];
    for (let offset = 0; ; ) {
      const page = await sb(`${path}&limit=1000&offset=${offset}`);
      if (!page || !page.length) break;
      out.push(...page);
      offset += page.length;
    }
    return out;
  }

  // ── Psychrometrics (same formulas as the Supabase generated columns) ──
  function psychro(T, RH, P = 1013.25) {
    if (T == null || RH == null || RH <= 0 || RH > 100) return {};
    T = Number(T); RH = Number(RH);
    const x = 17.67 * T / (T + 243.5), es = 6.112 * Math.exp(x), e = es * RH / 100, g = Math.log(RH / 100) + x;
    return { pdv: es, dwt: 243.5 * g / (17.67 - g), water_content: 216.7 * e / (T + 273.15), gpk: 621.97 * e / (P - e) };
  }

  function valueOf(row, code, src) {
    if (!row) return null;
    const t = TYPES[code];
    let v;
    if (src === WEATHER) v = t.wfield ? row[t.wfield] : psychro(row.weather_temp, row.weather_humidity)[t.field];
    else v = row[t.field];
    return v == null || isNaN(v) ? null : Number(v);
  }

  const fmt = (v, dp) => v == null ? '—' : v.toFixed(dp);
  const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const colourOf = src => src === WEATHER ? '#777777' : PALETTE[devices.indexOf(src) % PALETTE.length];
  const rowsOf = src => src === WEATHER ? weatherRows : allReadings.filter(r => r.device_name === src);

  // ── Load ───────────────────────────────────────────────
  async function loadAll() {
    setLoading(true);
    try {
      const jobs = await sb(`jobs?select=*&id=eq.${encodeURIComponent(jobId)}`);
      job = jobs[0];
      if (!job) { document.getElementById('nodes').innerHTML = '<div class="empty">Job not found</div>'; return; }

      document.title = `${job.site_name || 'Job ' + jobId} · DCC Environmental Monitor`;
      document.getElementById('jobTitle').textContent = `${job.site_name || 'Unnamed'} (Job ${job.id})`;
      const bits = [];
      if (job.job_start_date) bits.push('Started on ' + ukDate(job.job_start_date));
      if (job.postcode) bits.push(job.postcode);
      if (job.device_kit_name) bits.push(/^kit\b/i.test(job.device_kit_name) ? job.device_kit_name : 'Kit ' + job.device_kit_name);
      document.getElementById('jobMeta').textContent = bits.join('  ·  ');

      const [readings, settings] = await Promise.all([
        sbAll(`readings?select=*&job_id=eq.${encodeURIComponent(jobId)}&order=recorded_at.asc`),
        sb(`job_devices?select=*&job_id=eq.${encodeURIComponent(jobId)}`),
      ]);
      allReadings = readings;
      deviceSettings = Object.fromEntries((settings || []).map(s => [s.device_name, s]));
      // Sensors with readings, plus kit sensors registered in job_devices that haven't reported yet
      devices = [...new Set([...allReadings.map(r => r.device_name), ...(settings || []).map(s => s.device_name)])].filter(Boolean).sort();

      // One weather row per timestamp
      const seen = new Set();
      weatherRows = allReadings.filter(r => r.weather_temp != null && !seen.has(r.recorded_at) && seen.add(r.recorded_at));
      sources = weatherRows.length ? [...devices, WEATHER] : [...devices];

      if (!selection.length) loadSelection();
      renderTypeList();
      updateChart();
      document.getElementById('lastUpdated').textContent =
        'Updated ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    } catch (e) {
      console.error(e);
      document.getElementById('nodes').innerHTML = '<div class="empty">Error loading data. Check the console.</div>';
    } finally {
      setLoading(false);
    }
  }

  // ── Selection (kept in the URL, like Simplify's ?nodes= parameter) ──
  function loadSelection() {
    try {
      const raw = new URLSearchParams(location.search).get('nodes');
      if (raw) {
        const obj = JSON.parse(raw);
        selection = Object.entries(obj).flatMap(([src, codes]) => codes.filter(c => TYPES[c] && sources.includes(src)).map(c => `${src}|${c}`));
      }
    } catch (e) { selection = []; }
    if (!selection.length) selection = devices.map(d => `${d}|HUM`);
  }

  function saveSelection() {
    const obj = {};
    for (const k of selection) { const [src, c] = splitKey(k); (obj[src] ||= []).push(c); }
    const p = new URLSearchParams(location.search);
    p.set('nodes', JSON.stringify(obj));
    history.replaceState(null, '', `${location.pathname}?${p}`);
  }

  const splitKey = k => { const i = k.lastIndexOf('|'); return [k.slice(0, i), k.slice(i + 1)]; };
  const selectedTypes = () => [...new Set(selection.map(k => splitKey(k)[1]))];

  function canAddType(code) {
    const types = selectedTypes();
    return types.includes(code) || types.length < 2;
  }

  function flash(msg) {
    const el = document.getElementById('sideMsg');
    el.textContent = msg;
    clearTimeout(flash.t);
    flash.t = setTimeout(() => el.textContent = '', 4000);
  }

  function toggleSeries(src, code) {
    const key = `${src}|${code}`;
    const i = selection.indexOf(key);
    if (i >= 0) selection.splice(i, 1);
    else {
      if (!canAddType(code)) { flash('Two reading types at most (left and right axis). Deselect one first.'); return; }
      selection.push(key);
    }
    saveSelection(); renderTypeList(); updateChart();
  }

  function toggleType(code) {
    const keys = sources.map(s => `${s}|${code}`);
    const anyOn = keys.some(k => selection.includes(k));
    if (anyOn) selection = selection.filter(k => !keys.includes(k));
    else {
      if (!canAddType(code)) { flash('Two reading types at most (left and right axis). Deselect one first.'); return; }
      for (const k of keys) if (!selection.includes(k)) selection.push(k);
    }
    saveSelection(); renderTypeList(); updateChart();
  }

  function renderTypeList() {
    document.getElementById('typeList').innerHTML = CODES.map(c => {
      const keys = sources.map(s => `${s}|${c}`);
      const on = keys.some(k => selection.includes(k));
      return `<div class="type-item" onclick="toggleType('${c}')" title="${TYPES[c].name}">
        <span class="cb ${on ? 'on' : ''}"></span>${c}</div>`;
    }).join('');
  }

  // ── Period filter ──────────────────────────────────────
  function clearDates() { document.getElementById('startDate').value = ''; document.getElementById('endDate').value = ''; }
  function loadAllData() { clearDates(); document.getElementById('rangeSelect').value = '0'; updateChart(); }

  function periodFilter() {
    const s = document.getElementById('startDate').value;
    const e = document.getElementById('endDate').value;
    if (s || e) {
      const from = s ? new Date(s + 'T00:00:00') : null;
      const to   = e ? new Date(e + 'T23:59:59') : null;
      return r => { const d = parseTs(r.recorded_at); return (!from || d >= from) && (!to || d <= to); };
    }
    const hours = parseInt(document.getElementById('rangeSelect').value) || 0;
    if (!hours) return () => true;
    const cutoff = Date.now() - hours * 3600000;
    return r => parseTs(r.recorded_at).getTime() >= cutoff;
  }

  // ── Node cards ─────────────────────────────────────────
  function renderNodes() {
    const el = document.getElementById('nodes');
    if (!sources.length) { el.innerHTML = '<div class="empty">No sensors for this job yet. Check the job has a kit with sensors in config.</div>'; return; }
    const inPeriod = periodFilter();
    el.innerHTML = sources.map(src => nodeCard(src, inPeriod)).join('');
  }

  function nodeCard(src, inPeriod) {
    const isW = src === WEATHER;
    const rows = rowsOf(src);
    const latest = rows[rows.length - 1];
    const seen = latest ? parseTs(latest.recorded_at) : null;
    const st = sensorStatus(rows.map(r => r.recorded_at));
    const waiting = !isW && !rows.length;
    const flagGpk = isW ? null : valueOf(latest, 'GPK', src);
    const flagRh  = isW ? null : valueOf(latest, 'HUM', src);
    const isDry   = flagGpk != null && flagGpk <= DRY_GPK && flagRh != null && flagRh <= DRY_RH;
    const flag = flagGpk == null ? '' :
      `<span class="wet-flag ${isDry ? 'dry' : 'wet'} ${st.status === 'offline' ? 'old' : ''}" title="${esc(
        `GPK ${flagGpk.toFixed(2)} g/kg${flagRh != null ? ', RH ' + flagRh.toFixed(0) + ' %' : ''}. ` +
        `Dry when GPK is ${DRY_GPK} g/kg or under and RH is ${DRY_RH} % or under.` + (st.status === 'offline' ? ' Last known reading: sensor is offline.' : ''))}">${isDry ? 'DRY' : 'WET'}</span>`;
    const cls = isW ? 'external' : waiting ? 'waiting' : st.status === 'live' ? '' : st.status;
    const label = isW ? 'EXTERNAL' : waiting ? 'WAITING' : st.label;
    const bars = isW ? 3 : waiting ? 0 : { live: 3, delayed: 2, offline: 1 }[st.status];
    const tip = isW ? 'Outside conditions from forecast data'
      : waiting ? 'No readings yet. Readings are fetched hourly, so the first ones appear within about an hour.'
      : st.status === 'live' ? `Reporting normally, about every ${fmtDuration(st.interval)}`
      : `No reading for ${fmtDuration(st.age)}. Usually reports every ${fmtDuration(st.interval)}.`;
    const s = deviceSettings[src] || {};
    const periodRows = rows.filter(inPeriod);
    const codes = isW ? ['DWT', 'HUM', 'TMP', 'WCT', 'GPK'] : CODES;

    const info = isW
      ? `<div class="info-row"><div class="info-label">Name</div><div class="info-val">Weather</div></div>
         <div class="info-row"><div class="info-label">Type</div><div class="info-val">Outside, from forecast data</div></div>`
      : `<div class="info-row"><div class="info-label">Name</div><div class="info-val">${esc(src)}
           <button class="pen" data-dev="${esc(src)}" onclick="openModal(this.dataset.dev)" title="Edit sensor">
             <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.3V21h3.7l11-11-3.7-3.7-11 11zM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.7 3.7L20.7 7z"/></svg>
           </button></div></div>
         <div class="info-row"><div class="info-label">Location</div><div class="info-val">${esc(s.location) || '—'}</div></div>
         <div class="info-row"><div class="info-label">Type</div><div class="info-val">${s.type === 'ambient' ? 'Ambient' : 'Enclosed'}</div></div>`;

    const rowsHtml = codes.map(code => {
      const key = `${src}|${code}`;
      const on = selection.includes(key);
      const t = TYPES[code];
      const vals = periodRows.map(r => valueOf(r, code, src)).filter(v => v != null);
      const min = vals.length ? Math.min(...vals) : null;
      const max = vals.length ? Math.max(...vals) : null;
      const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
      const disabled = !on && !canAddType(code);
      return `<div class="sensor-row ${on ? 'sel' : ''} ${statsOpen.has(key) ? 'show-stats' : ''}">
        <div class="row">
          <span class="cb ${on ? 'on' : ''} ${disabled ? 'disabled' : ''}" data-src="${esc(src)}" data-code="${code}" onclick="toggleSeries(this.dataset.src, this.dataset.code)"></span>
          <span class="code" title="${t.name}" data-src="${esc(src)}" data-code="${code}" onclick="toggleSeries(this.dataset.src, this.dataset.code)">${code}</span>
          <span class="val-wrap">
            <span class="val">${fmt(valueOf(latest, code, src), t.dp)} ${t.unit}</span>
            <span class="swatch" style="${on ? 'background:' + colourOf(src) : ''}"></span>
          </span>
          <button class="menu" data-key="${esc(key)}" onclick="toggleStats(this.dataset.key)" title="Min / avg / max for the period">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="18" height="2.6" rx="1"/><rect x="3" y="10.7" width="18" height="2.6" rx="1"/><rect x="3" y="16.4" width="18" height="2.6" rx="1"/></svg>
          </button>
        </div>
        <div class="stats"><span>Min ${fmt(min, t.dp)}</span><span>Avg ${fmt(avg, t.dp)}</span><span>Max ${fmt(max, t.dp)}</span><span>${t.unit}</span></div>
      </div>`;
    }).join('');

    const seenStr = seen ? `${seen.toLocaleString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })} <span style="color:var(--text-dim)">(${fmtDuration(st.age)} ago)</span>` : '—';

    return `<div class="node ${cls}">
      <div class="status-bar" title="${esc(tip)}">
        <span class="status-text">${label}</span>
        <span class="signal"><i class="${bars >= 1 ? 'on' : ''}" style="height:5px"></i><i class="${bars >= 2 ? 'on' : ''}" style="height:10px"></i><i class="${bars >= 3 ? 'on' : ''}" style="height:15px"></i></span>
        ${flag}
      </div>
      <div class="contents">
        <div class="info-head">
          ${info}
          <div class="info-row"><div class="info-label">Last seen</div><div class="info-val">${seenStr}</div></div>
        </div>
        ${rowsHtml}
      </div>
    </div>`;
  }

  function toggleStats(key) {
    statsOpen.has(key) ? statsOpen.delete(key) : statsOpen.add(key);
    renderNodes();
  }

  // ── Chart ──────────────────────────────────────────────
  function updateChart() {
    renderNodes(); // keeps min/avg/max in step with the period
    const inPeriod = periodFilter();
    const types = selectedTypes();
    const axisOf = code => code === types[0] ? 'y' : 'y1';

    const series = selection.map(key => {
      const [src, code] = splitKey(key);
      const byTs = new Map(rowsOf(src).filter(inPeriod).map(r => [r.recorded_at, r]));
      return { key, src, code, byTs };
    });

    const timestamps = [...new Set(series.flatMap(s => [...s.byTs.keys()]))].sort();
    const labels = timestamps.map(ts => {
      const d = parseTs(ts);
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    });

    const datasets = series.map(s => ({
      label: `${s.src === WEATHER ? 'Weather' : s.src} ${s.code}`,
      code: s.code,
      yAxisID: axisOf(s.code),
      data: timestamps.map(ts => valueOf(s.byTs.get(ts), s.code, s.src)),
      borderColor: colourOf(s.src),
      backgroundColor: colourOf(s.src),
      borderDash: axisOf(s.code) === 'y1' ? [5, 3] : [],
      borderWidth: 1.5, pointRadius: 0, pointHoverRadius: 3, tension: 0, spanGaps: true,
    }));

    const ns = document.getElementById('noSeries');
    const hasData = timestamps.length > 0;
    ns.textContent = !datasets.length ? 'Tick a reading on a sensor below to chart it'
      : allReadings.length ? 'No readings in this period' : 'No readings yet. The first ones usually appear within an hour.';
    ns.style.display = hasData ? 'none' : 'flex';
    document.getElementById('leftAxisLabel').textContent  = types[0] ? `Left (${types[0]})`  : 'Left';
    document.getElementById('rightAxisLabel').textContent = types[1] ? `Right (${types[1]})` : 'Right';

    const num = id => { const v = document.getElementById(id).value; return v === '' ? undefined : Number(v); };
    const axisTitle = code => code ? `${code}(${TYPES[code].unit})` : '';
    const tickFont = { family: 'Arial, sans-serif', size: 11 };
    const C = { axis: cssVar('--chart-text'), grid: cssVar('--chart-grid'), surface: cssVar('--surface'), line: cssVar('--line'), text: cssVar('--text') };

    if (chart) chart.destroy();
    chart = new Chart(document.getElementById('chart'), {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: C.surface, borderColor: C.line, borderWidth: 1,
            titleColor: C.text, bodyColor: C.text, titleFont: tickFont, bodyFont: tickFont,
            boxPadding: 4, usePointStyle: true,
            callbacks: {
              label: ctx => {
                const v = ctx.parsed.y, t = TYPES[ctx.dataset.code];
                return ` ${ctx.dataset.label}: ${v == null ? '—' : v.toFixed(t.dp) + ' ' + t.unit}`;
              },
            },
          },
        },
        scales: {
          x: {
            ticks: { color: C.axis, font: tickFont, maxRotation: 60, minRotation: 60, autoSkip: true, maxTicksLimit: innerWidth < 700 ? 6 : 12 },
            grid: { color: C.grid }, border: { color: C.axis },
          },
          y: {
            display: !!types[0], position: 'left', min: num('yMin'), max: num('yMax'),
            ticks: { color: C.axis, font: tickFont },
            grid: { color: C.grid }, border: { color: C.axis },
            title: { display: true, text: axisTitle(types[0]), color: C.axis, font: { ...tickFont, weight: 'bold' } },
          },
          y1: {
            display: !!types[1], position: 'right', min: num('y1Min'), max: num('y1Max'),
            ticks: { color: C.axis, font: tickFont },
            grid: { drawOnChartArea: false }, border: { color: C.axis },
            title: { display: true, text: axisTitle(types[1]), color: C.axis, font: { ...tickFont, weight: 'bold' } },
          },
        },
      },
    });
  }

  // ── Sidebar / menus ────────────────────────────────────
  function toggleCollapse(btn, id) {
    btn.classList.toggle('open');
    document.getElementById(id).classList.toggle('open');
  }
  function toggleGear(e) { e.stopPropagation(); document.getElementById('gearMenu').classList.toggle('open'); }
  document.addEventListener('click', () => document.getElementById('gearMenu').classList.remove('open'));

  async function archiveJob() {
    if (!confirm('Archive this job? It will move to the Archive list and stop receiving new readings.')) return;
    try {
      await sb(`jobs?id=eq.${encodeURIComponent(jobId)}`, {
        method: 'PATCH', prefer: 'return=minimal',
        body: { active: false, job_end_date: new Date().toISOString().split('T')[0] },
      });
      location.href = 'index.html';
    } catch (e) { alert('Error archiving job: ' + e.message); }
  }

  // ── Edit sensor modal ──────────────────────────────────
  function openModal(deviceName) {
    editingDevice = deviceName;
    const s = deviceSettings[deviceName] || {};
    document.getElementById('modalDeviceName').textContent = deviceName;
    document.getElementById('inputLocation').value = s.location || '';
    document.getElementById('inputType').value = s.type || 'enclosed';
    const st = document.getElementById('saveStatus'); st.textContent = ''; st.className = 'form-msg';
    document.getElementById('modalOverlay').classList.add('open');
    document.getElementById('inputLocation').focus();
  }

  function closeModal(e) {
    if (e && e.target !== document.getElementById('modalOverlay')) return;
    document.getElementById('modalOverlay').classList.remove('open');
    editingDevice = null;
  }

  async function saveDeviceSettings() {
    if (!editingDevice) return;
    const location_ = document.getElementById('inputLocation').value.trim();
    const type = document.getElementById('inputType').value;
    const st = document.getElementById('saveStatus');
    st.className = 'form-msg'; st.textContent = 'Saving…';
    try {
      const jid = parseInt(jobId);
      const dev = encodeURIComponent(editingDevice);
      const existing = await sb(`job_devices?job_id=eq.${jid}&device_name=eq.${dev}&select=id`);
      if (existing && existing.length) {
        await sb(`job_devices?job_id=eq.${jid}&device_name=eq.${dev}`, { method: 'PATCH', prefer: 'return=minimal', body: { location: location_, type } });
      } else {
        await sb('job_devices', { method: 'POST', prefer: 'return=minimal', body: { job_id: jid, device_name: editingDevice, location: location_, type } });
      }
      deviceSettings[editingDevice] = { ...(deviceSettings[editingDevice] || {}), location: location_, type };
      st.className = 'form-msg ok'; st.textContent = 'Saved';
      renderNodes();
      setTimeout(() => closeModal(), 600);
    } catch (e) {
      console.error(e);
      st.className = 'form-msg error'; st.textContent = 'Error saving. Try again.';
    }
  }

  // ── Helpers ────────────────────────────────────────────
  const pad = n => String(n).padStart(2, '0');
  function ukDate(d) { return new Date(d).toLocaleDateString('en-GB'); }
  function setLoading(on) {
    const b = document.getElementById('refreshBtn');
    b.disabled = on;
    b.querySelector('svg').classList.toggle('spin', on);
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  window.addEventListener('themechange', () => { if (chart) updateChart(); });

  // ── Auth + init ────────────────────────────────────────
  async function signOut() { await sb_auth.auth.signOut(); location.href = 'login.html'; }

  (async () => {
    const { data: { session } } = await sb_auth.auth.getSession();
    if (!session) { location.href = 'login.html'; return; }
    loadAll();
  })();
</script>
</body>
</html>
